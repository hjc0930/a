      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="920" height="300" fill="#ffffff"/>
  <text x="40" y="44" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#1F2937">图 3-2 从 seed 派生全站</text>
  <text x="40" y="70" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#6B7280">改一个主色，整套 token 自动重算</text>

  <rect x="40" y="100" width="180" height="80" rx="10" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="58" y="130" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1F2937">Seed</text>
  <text x="58" y="152" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#374151">单个主色 #2F6FED</text>

  <rect x="270" y="100" width="180" height="80" rx="10" fill="#d5e8d4" stroke="#82b366"/>
  <text x="288" y="130" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1F2937">Map</text>
  <text x="288" y="152" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#374151">派生 10 级色阶</text>

  <rect x="500" y="100" width="180" height="80" rx="10" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="518" y="130" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1F2937">Alias / Purpose</text>
  <text x="518" y="152" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#374151">primary / hover / disabled</text>

  <rect x="730" y="100" width="150" height="80" rx="10" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="748" y="130" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1F2937">Component</text>
  <text x="748" y="152" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#374151">button.bg.primary</text>

  <line x1="224" y1="140" x2="266" y2="140" stroke="#6B7280" stroke-width="1.6" marker-end="url(#s2)"/>
  <line x1="454" y1="140" x2="496" y2="140" stroke="#6B7280" stroke-width="1.6" marker-end="url(#s2)"/>
  <line x1="684" y1="140" x2="726" y2="140" stroke="#6B7280" stroke-width="1.6" marker-end="url(#s2)"/>

  <text x="40" y="228" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#374151">Material 3：seed → reference palette（HCT）→ color role → component token</text>
  <text x="40" y="252" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#374151">Ant Design 5：seed → map → alias → component（CSS-in-JS 运行时派生）</text>
